# manifest.yaml — Python + FastAPI example
# Generated by halo init

project:
  name: model-set-service
  language: python
  version_constraint: ">=3.12"

tools:
  required:
    - { name: python, check: "python3 --version" }
    - { name: yq,     check: "yq --version" }
  optional:
    - { name: uv, check: "uv --version" }

services:
  local:
    - name: postgres
      health: "pg_isready -h127.0.0.1"
      start: "docker compose up -d postgres"
  test:
    - name: postgres
      health: "pg_isready -htest-postgres.example.com"

commands:
  build:            "python3 -m compileall -q app"
  lint:             "ruff check app tests"
  test:             "pytest -q"
  integration_test: "pytest -q tests/integration"
  smoke_test:       "curl -sf http://localhost:8000/health"

specs:
  dir: "halo/specs"
  active: ""
  template: "halo/kernel/orchestrator/templates/spec-template.md"

testing:
  strategies:
    python:
      file_pattern: "test_*.py"
      func_regex: 'def test_ac([0-9]+)'
      ac_group: 1

drift:
  ddl:
    # SQLAlchemy DDL drift is not implemented. The gate reports this dimension as NOT
    # verified rather than as clean — that honesty is part of what this example shows.
    orm: sqlalchemy
  routes:
    framework: fastapi
    file_glob: "*.py"
  error_codes:
    file_glob: "*.py"
    const_pattern: '[A-Z][A-Z0-9_]+ *= *[0-9]+'

pipeline:
  steps:
    - { name: bootstrap,      run: "halo/kernel/delivery/bootstrap.sh check",                   skip_when: never }
    - { name: spec-lint,      run: "halo/kernel/delivery/gates/spec-lint.sh ${SPEC_FILE}",      skip_when: no_spec }
    - { name: prismspec-lint, run: "prismspec/bin/lint.sh $(dirname ${SPEC_FILE}) spec",        skip_when: no_spec }
    - { name: build,          run: "${commands.build}",                                        skip_when: no_code }
    - { name: lint,           run: "${commands.lint}",                                         skip_when: no_code }
    - { name: unit-test,      run: "${commands.test}",                                         skip_when: no_code }
    - { name: ac-coverage,    run: "halo/kernel/delivery/gates/ac-coverage.sh ${SPEC_FILE} .",  skip_when: no_spec }
    - { name: drift-check,    run: "halo/kernel/delivery/gates/drift-check.sh ${SPEC_FILE} .",  skip_when: no_spec }
    - { name: compliance,     run: "halo/kernel/delivery/gates/compliance.sh ${SPEC_FILE}",     skip_when: no_spec }

deploy:
  docker:
    builder_image: "python:3.12-slim"
    runner_image:  "python:3.12-slim"
    dockerfile:    "deploy/Dockerfile"
  registry: "registry.example.com"
  environments:
    test:
      namespace: "model-set-service-test"
      manifests: "deploy/k8s/"
      rollback: auto
      smoke_after_deploy: true

kernel:
  layers:
    orchestrator: true
    context: true
    delivery: true

context:
  root: "halo/context"
  map_file: "halo/context/README.md"
  external_file: "halo/context/external.md"
  sources_file: "halo/context/sources.yaml"
  knowledge:
    dir: "halo/context/knowledge"
    drafts_dir: "halo/context/drafts"
  central:
    repo: ""
    cache_dir: "halo/context/.central"
    mode: read-only
    conflict: project-wins
